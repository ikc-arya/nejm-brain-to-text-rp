# Stage 2: phoneme CTC fine-tuning on B2T -> val PER (1426 val trials, greedy CTC, same as the GRU baseline).
# Mac-scale. Full scale: configs/ctc_human_gpu.yaml
# Variants (CLI overrides):
#   SSL init         init=ssl init_checkpoint=experiments/<ssl_run>/checkpoint/best_checkpoint
#   random init      init=random                (control: same architecture, no pretraining)
#   linear probe     freeze_backbone_steps=-1   (backbone frozen the whole run)
data_root: ${oc.env:DATA_ROOT,../data}   # parent of hdf5_data_final/ and allen/; CLI: data_root=/path
b2t_sessions: all        # B2T sessions to use: all, or a list, e.g. b2t_sessions=[t15.2023.08.13,t15.2023.08.18]
init: ssl
init_checkpoint: experiments/ssl_human/checkpoint/best_checkpoint
freeze_backbone_steps: 500   # warm-up: stem (day scale/bias, w_in, patch_proj) + ctc_head only, then unfreeze

model:                       # used as-is for init=random; with init=ssl the architecture comes from the checkpoint
  n_embd: 384
  n_layer: 6
  backbone_dropout: 0.03
  patch_size: 14
  patch_stride: 4
  ar_horizon: 4
  input_dropout: 0.2
  binary_input: true
  n_phonemes: 41

source:
  type: b2t
  dataset_dir: ${data_root}/hdf5_data_final
  sessions: ${b2t_sessions}
  batch_size: 64
  days_per_batch: 4
  num_workers: 4
  seed: 1
  data_transforms:           # GRU baseline augmentations; smoothing causal to match Stage 1 (baseline: acausal)
    white_noise_std: 1.0
    constant_offset_std: 0.2
    random_cut: 3
    smooth: causal
    smooth_kernel_std: 2
    smooth_kernel_size: 100

device: auto
use_native_kernels: true
pad_time_multiple: 128   # bucket sequence lengths (MPS compiles a graph per shape)
grad_checkpoint: true     # recompute blocks in backward: fits B=64 full trials in unified memory
use_amp: true
seed: 10
output_dir: experiments/ctc_human
checkpoint_dir: experiments/ctc_human/checkpoint

num_training_batches: 3000
lr_max: 0.002                # stem + ctc_head
lr_max_backbone: 0.0003      # pretrained backbone: lower LR after unfreezing
lr_min: 0.00001
lr_warmup_steps: 200
lr_decay_steps: 3000
beta0: 0.9
beta1: 0.999
epsilon: 1.0e-08
weight_decay: 0.001
grad_norm_clip_value: 10
batches_per_train_log: 50
batches_per_val_step: 500
